<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Adobe Express for Education</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 60px 20px;
      color: #0F172A;
      background: #F8FAFC;
    }
    .box {
      max-width: 500px;
      margin: 0 auto;
      background: #FFFFFF;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { color: #64748B; margin-bottom: 24px; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      padding: 12px 20px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 800;
      color: #FFF;
      display: block;
    }
    .btn-student { background: linear-gradient(135deg, #6366F1, #A855F7); }
    .btn-teacher { background: #0F172A; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Select Your Portal</h1>
    <p>Please choose which portal you want to access:</p>
    <div class="btn-group">
      <a href="./student/" class="btn btn-student">🎒 Open Student Studio</a>
      <a href="./teacher/" class="btn btn-teacher">👩‍🏫 Open Teacher Hub</a>
    </div>
  </div>
</body>
</html>
